<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursos</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141416">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cursos">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="tema.css">
<script src="diag.js"></script>
<script src="fretboard.js"></script>
<script src="braco.js"></script>
<script src="cordas.js"></script>
<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1/dist/alphaTab.min.js"></script>
<link rel="stylesheet" href="cursos.css">
</head>
<body>
  <div class="stage">
    <a class="back-link" id="backLink" href="index.html">‹ Menu</a>
    <div id="app"></div>
  </div>

<script>
  const SOUNDFONT = 'https://cdn.jsdelivr.net/npm/@coderline/alphatab@1/dist/soundfont/sonivox.sf2';
  const PROGRESS_KEY = 'appMusica.cursos.v1';

  const $app = document.getElementById('app');
  const $back = document.getElementById('backLink');

  let courseIndex = null;
  const courseCache = {};
  let exercises = [];     // cartões de exercício da tela atual
  let activeCard = null;  // só um player ativo por vez
  let io = null;

  // ---------- progresso (localStorage) ----------
  function loadProgress(){
    try{ return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; }catch(e){ return {}; }
  }
  function saveProgress(p){
    try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); }catch(e){}
  }
  function isDone(cid, tid){
    const p = loadProgress();
    return !!(p[cid] && p[cid][tid]);
  }
  function setDone(cid, tid, value){
    const p = loadProgress();
    p[cid] = p[cid] || {};
    if (value) p[cid][tid] = true; else delete p[cid][tid];
    saveProgress(p);
  }
  function allTopics(course){
    return course.modules.flatMap(m => m.topics.map(t => ({ module: m, topic: t })));
  }
  function progressOf(course){
    const topics = allTopics(course);
    const done = topics.filter(x => isDone(course.id, x.topic.id)).length;
    return { done, total: topics.length, pct: topics.length ? Math.round(done / topics.length * 100) : 0 };
  }
  function progressBarHTML(pr){
    return `<div class="progress"><div class="progress-fill" style="width:${pr.pct}%"></div></div>
            <div class="progress-label">${pr.done} de ${pr.total} tópicos concluídos (${pr.pct}%)</div>`;
  }

  // ---------- dados ----------
  async function loadJSON(path){
    const r = await fetch(path);
    if (!r.ok) throw new Error('Não consegui carregar ' + path + ' (' + r.status + ')');
    return r.json();
  }
  async function getCourse(id){
    if (courseCache[id]) return courseCache[id];
    const entry = courseIndex.find(c => c.id === id);
    if (!entry) throw new Error('Curso não encontrado: ' + id);
    const course = await loadJSON(entry.path);
    courseCache[id] = course;
    return course;
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // ---------- telas ----------
  function coverSVG(c){
    const v = c.cover || {}, a = v.accent || '#ff9437', id = 'cv' + Math.random().toString(36).slice(2, 6);
    const X = (i, y) => (20 + i * 52) + (400 - y) / 230 * ((150 + (i - 2.5) * 14) - (20 + i * 52));
    let h = `<svg viewBox="0 0 300 400" class="cover" role="img" aria-label="${esc(c.title)}"><defs><linearGradient id="${id}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1d23"/><stop offset="1" stop-color="#0b0b0d"/></linearGradient><filter id="${id}g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter></defs><rect width="300" height="400" fill="url(#${id}b)"/>`;
    [380, 335, 292, 254, 220, 190].forEach(y => { h += `<line x1="${X(0, y)}" y1="${y}" x2="${X(5, y)}" y2="${y}" stroke="#55555e" stroke-width="2" opacity=".7"/>`; });
    for (let i = 0; i < 6; i++) h += `<line x1="${X(i, 400)}" y1="400" x2="${X(i, 170)}" y2="170" stroke="#9a9aa4" stroke-width="${1 + i * .4}" opacity=".6"/>`;
    [[1, 292], [3, 254], [4, 335], [2, 220]].forEach(([i, y]) => { const x = X(i, y); h += `<circle cx="${x}" cy="${y - 20}" r="13" fill="${a}" opacity=".8" filter="url(#${id}g)"/><circle cx="${x}" cy="${y - 20}" r="9" fill="${a}"/>`; });
    h += `<rect x="0" y="0" width="300" height="190" fill="url(#${id}b)" opacity=".92"/><text x="24" y="66" font-family="Oswald,sans-serif" font-weight="600" font-size="30" letter-spacing="1.5" fill="#eee7d8">${esc(v.l1 || c.title)}</text>`;
    if (v.l2) h += `<text x="22" y="124" font-family="Oswald,sans-serif" font-weight="700" font-size="58" letter-spacing="1" fill="${a}">${esc(v.l2)}</text>`;
    h += `<rect x="24" y="142" width="46" height="4" rx="2" fill="${a}"/>`;
    if (v.tag) h += `<text x="24" y="170" font-family="Inter,sans-serif" font-weight="600" font-size="13" letter-spacing="2" fill="#9a968c">${esc(String(v.tag).toUpperCase())}</text>`;
    return h + '</svg>';
  }
  function renderList(){
    $back.href = 'index.html'; $back.textContent = '‹ Menu';
    let html = `<div class="eyebrow">Biblioteca</div><h1 class="h-title">Cursos</h1><div class="cv-grid">`;
    courseIndex.forEach(c => {
      const course = courseCache[c.id], pr = course ? progressOf(course) : null;
      html += `<a class="cv-card" href="#/c/${esc(c.id)}">${coverSVG(c)}<div class="cv-info"><div class="bar"><i data-course="${esc(c.id)}" style="width:${pr ? pr.pct : 0}%"></i></div><span data-lbl="${esc(c.id)}">${pr ? pr.done + ' de ' + pr.total + ' tópicos' : 'Abrir curso'}</span></div></a>`;
    });
    $app.innerHTML = html + '</div>';
    courseIndex.forEach(async c => {
      try{
        const pr = progressOf(await getCourse(c.id));
        $app.querySelector(`i[data-course="${c.id}"]`).style.width = pr.pct + '%';
        $app.querySelector(`span[data-lbl="${c.id}"]`).textContent = pr.done + ' de ' + pr.total + ' tópicos';
      }catch(e){}
    });
  }

  function statusOf(t){
    const n = (t.blocks || []).filter(b => b.type === 'exercise').length;
    return n ? n + (n === 1 ? ' exercício' : ' exercícios') : 'Leitura';
  }

  function renderCourse(course){
    $back.href = '#/'; $back.textContent = '‹ Cursos';
    const pr = progressOf(course), c = courseIndex.find(x => x.id === course.id) || { title: course.title };
    const nxt = allTopics(course).find(x => Array.isArray(x.topic.blocks) && x.topic.blocks.length && !isDone(course.id, x.topic.id));
    let html = `<div class="c-hero"><div class="c-cover">${coverSVG(c)}</div><div class="c-meta"><div class="eyebrow">Curso</div>
      <h1 class="h-title" style="font-size:1.3rem">${esc(course.title)}</h1><div class="sub">${course.modules.length} módulos · ${pr.total} tópicos</div>
      <div class="bar"><i style="width:${pr.pct}%"></i></div><div class="sub">${pr.done} de ${pr.total} concluídos (${pr.pct}%)</div>
      ${nxt ? `<a class="btn-go" href="#/c/${esc(course.id)}/t/${esc(nxt.topic.id)}">${pr.done ? 'Continuar' : 'Começar'}</a>` : ''}</div></div>`;
    course.modules.forEach(m => {
      const ts = m.topics, d = ts.filter(t => isDone(course.id, t.id)).length, open = nxt && ts.includes(nxt.topic);
      html += `<details class="mod" ${open ? 'open' : ''}><summary><span class="mod-t">${esc(m.title)}</span><span class="mod-n">${d}/${ts.length}</span></summary>
        <div class="mod-bar"><i style="width:${ts.length ? Math.round(d / ts.length * 100) : 0}%"></i></div>`;
      ts.forEach(t => {
        const ready = Array.isArray(t.blocks) && t.blocks.length, ck = `<span class="tk ${isDone(course.id, t.id) ? 'done' : ''}">✓</span>`;
        html += ready ? `<a class="topic" href="#/c/${esc(course.id)}/t/${esc(t.id)}">${ck}<span class="tt"><b>${esc(t.title)}</b><small>${statusOf(t)}</small></span><span class="chev">›</span></a>`
                      : `<div class="topic off">${ck}<span class="tt"><b>${esc(t.title)}</b><small>em breve</small></span></div>`;
      });
      html += `</details>`;
    });
    $app.innerHTML = html;
  }

  function renderTopic(course, topicId){
    const list = allTopics(course);
    const idx = list.findIndex(x => x.topic.id === topicId);
    if (idx < 0) throw new Error('Tópico não encontrado: ' + topicId);
    const { module, topic } = list[idx];
    $back.href = '#/c/' + course.id; $back.textContent = '‹ Curso';

    $app.innerHTML = `<div class="eyebrow">${esc(module.title)}</div><h1 class="h-title">${esc(topic.title)}</h1><div class="topic-body" id="topicBody"></div>`;
    const body = document.getElementById('topicBody');

    (topic.blocks || []).forEach(b => {
      if (b.type === 'p'){
        const p = document.createElement('p'); p.className = 'topic-p'; p.innerHTML = b.html; body.appendChild(p);
      } else if (b.type === 'note'){
        const d = document.createElement('div'); d.className = 'topic-note'; d.innerHTML = b.html; body.appendChild(d);
      } else if (b.type === 'h'){
        const h = document.createElement('div'); h.className = 'topic-h2'; h.textContent = b.text; body.appendChild(h);
      } else if (b.type === 'h3'){
        const h = document.createElement('div'); h.className = 'topic-h3'; h.textContent = b.text; body.appendChild(h);
      } else if (b.type === 'ul'){
        const ul = document.createElement('ul'); ul.className = 'topic-ul';
        b.items.forEach(it => { const li = document.createElement('li'); li.innerHTML = it; ul.appendChild(li); });
        body.appendChild(ul);
      } else if (b.type === 'code'){
        const pre = document.createElement('div'); pre.className = 'topic-code'; pre.textContent = b.text; body.appendChild(pre);
      } else if (b.type === 'img'){
        const fig = document.createElement('figure'); fig.className = 'topic-fig' + (b.dark ? ' dark' : ''); fig.style.margin = '14px 0';
        const im = document.createElement('img'); im.src = b.src; im.loading = 'lazy'; im.alt = b.caption || '';
        im.addEventListener('click', () => window.open(b.src, '_blank'));
        fig.appendChild(im);
        if (b.caption){ const cap = document.createElement('figcaption'); cap.textContent = b.caption; fig.appendChild(cap); }
        if (b.reveal){
          const det = document.createElement('details'); det.className = 'esq-reveal';
          const sm = document.createElement('summary'); sm.textContent = b.reveal;
          det.appendChild(sm); det.appendChild(fig); body.appendChild(det);
        } else {
          body.appendChild(fig);
        }
      } else if (b.type === 'cards'){
        const grid = document.createElement('div'); grid.className = 'esq-cards';
        b.items.forEach(it => {
          const c = document.createElement('div'); c.className = 'esq-card';
          const big = document.createElement('div'); big.className = 'esq-card-big'; big.textContent = it.big; c.appendChild(big);
          if (it.title){ const t = document.createElement('div'); t.className = 'esq-card-title'; t.textContent = it.title; c.appendChild(t); }
          if (it.text){ const x = document.createElement('div'); x.className = 'esq-card-text'; x.textContent = it.text; c.appendChild(x); }
          grid.appendChild(c);
        });
        body.appendChild(grid);
      } else if (b.type === 'chords'){
        const row = document.createElement('div'); row.className = 'chords-grid';
        b.items.forEach(it => {
          const card = document.createElement('div'); card.className = 'chord-card';
          const t = document.createElement('b'); t.textContent = it.name; card.appendChild(t);
          const area = document.createElement('div'); card.appendChild(area);
          renderBracoVertical(area, it.frets, it.root, 'fingers'); row.appendChild(card);
        });
        body.appendChild(row);
      } else if (b.type === 'exercise'){
        body.appendChild(buildExercise(b));
      }
    });

    const done = isDone(course.id, topic.id);
    const next = list.slice(idx + 1).find(x => Array.isArray(x.topic.blocks) && x.topic.blocks.length);
    const row = document.createElement('div');
    row.className = 'done-row';
    row.innerHTML = `<button class="btn-main ${done ? 'is-done' : ''}" id="doneBtn">${done ? '✓ Concluído (desmarcar)' : 'Marcar como concluído'}</button>
      ${next ? `<a class="link-next" href="#/c/${esc(course.id)}/t/${esc(next.topic.id)}">Próximo: ${esc(next.topic.title)} ›</a>` : ''}`;
    body.appendChild(row);
    document.getElementById('doneBtn').addEventListener('click', () => {
      const now = !isDone(course.id, topic.id);
      setDone(course.id, topic.id, now);
      const btn = document.getElementById('doneBtn');
      btn.classList.toggle('is-done', now);
      btn.textContent = now ? '✓ Concluído (desmarcar)' : 'Marcar como concluído';
    });
  }

  // ---------- exercício (tab + player) ----------
  function makeSettings(withPlayer){
    const s = {
      display: { scale: window.innerWidth < 520 ? 0.8 : 0.95, staveProfile: alphaTab.StaveProfile.Tab,
        resources: { staffLineColor: 'rgba(110,110,122,1)', barSeparatorColor: 'rgba(110,110,122,1)', barNumberColor: 'rgba(154,150,140,1)', mainGlyphColor: 'rgba(238,231,216,1)', secondaryGlyphColor: 'rgba(154,150,140,1)', scoreInfoColor: 'rgba(238,231,216,1)' } },
      player: withPlayer
        ? { playerMode: alphaTab.PlayerMode.EnabledAutomatic, soundFont: SOUNDFONT, scrollMode: alphaTab.ScrollMode.Off }
        : { playerMode: alphaTab.PlayerMode.Disabled }
    };
    return s;
  }

  // posição (corda, casa) das notas do alphaTab no braço (índice 0 = 6ª corda)
  function noteStr(n){
    const c = [n.string - 1, 6 - n.string], m = c.find(i => i >= 0 && i < 6 && OPEN_STRING_MIDI[i] + n.fret === n.realValue);
    return m !== undefined ? m : c[0];
  }
  function collectPos(score){
    const seen = new Set(), out = [];
    score.tracks[0].staves[0].bars.forEach(bar => bar.voices.forEach(v => v.beats.forEach(b => b.notes.forEach(n => {
      if (n.isDead || n.fret < 0) return;
      const si = noteStr(n), k = si + ',' + n.fret;
      if (!seen.has(k)){ seen.add(k); out.push([si, n.fret]); }
    }))));
    return out;
  }
  function boardStart(pos){
    const f = pos.filter(p => p[1] > 0).map(p => p[1]);
    if (!f.length) return 0;
    const mn = Math.min(...f), mx = Math.max(...f);
    return mx - mn <= 4 ? Math.max(0, mn - 1) : null;
  }

  function buildExercise(block){
    const wrap = document.createElement('div');
    wrap.className = 'ex-card';
    wrap.innerHTML = `
      <div class="ex-title">${esc(block.title)}</div>
      <div class="ex-tab"><div class="ex-host"></div><div class="ex-loading">Carregando a tablatura…</div></div>
      <div class="ex-board"></div>
      <div class="ex-controls">
        <button class="ex-play">▶ Tocar</button>
        <button class="ex-stop" title="Parar">■</button>
        <div class="bpm-box">
          <button class="bpm-minus">−</button>
          <input type="number" class="bpm-input" min="20" max="300">
          <button class="bpm-plus">+</button>
          <span class="hint">BPM</span>
        </div>
        <button class="chip chip-metro" aria-pressed="false">Metrônomo</button>
        <button class="chip chip-count" aria-pressed="false">Contagem</button>
        <button class="chip chip-loop" aria-pressed="false">Repetir</button>
      </div>
      ${block.hint ? `<div class="ex-hint">${esc(block.hint)}</div>` : ''}
      <div class="ex-status"></div>`;

    const card = {
      wrap, block, api: null, hasPlayer: false, ready: false, pendingPlay: false, mounted: false,
      base: block.tempo || 100, bpm: block.tempo || 100, metro: false, count: false, loop: false
    };
    const q = (s) => wrap.querySelector(s);
    const playBtn = q('.ex-play'), bpmInput = q('.bpm-input'), statusEl = q('.ex-status'), loadingEl = q('.ex-loading');
    bpmInput.value = card.bpm;
    const boardEl = q('.ex-board');
    function drawBoard(lit){ if (card.board && !lit.length) card.board.clear(); }

    function setStatus(msg, isError){ statusEl.textContent = msg || ''; statusEl.className = 'ex-status' + (isError ? ' error' : ''); }

    function applyPlayerSettings(){
      if (!card.api || !card.hasPlayer || !card.ready) return;
      card.api.playbackSpeed = card.bpm / card.base;
      card.api.metronomeVolume = card.metro ? 1 : 0;
      card.api.countInVolume = card.count ? 1 : 0;
      card.api.isLooping = card.loop;
    }

    function createApi(withPlayer){
      destroyApi();
      const host = q('.ex-host');
      host.innerHTML = '';
      const el = document.createElement('div');
      host.appendChild(el);
      const api = new alphaTab.AlphaTabApi(el, makeSettings(withPlayer));
      card.api = api; card.hasPlayer = withPlayer; card.ready = false;
      if (withPlayer && window.Diag) Diag.attach(api, 'curso');

      api.renderFinished.on(() => { loadingEl.style.display = 'none'; });
      api.error.on((e) => setStatus('Erro: ' + (e && e.message ? e.message : e), true));

      if (withPlayer){
        setStatus('Carregando o som…');
        api.soundFontLoad.on((e) => {
          if (!card.ready && e.total) setStatus('Carregando o som… ' + Math.floor(e.loaded / e.total * 100) + '%');
        });
        api.playerReady.on(() => {
          card.ready = true;
          setStatus('');
          applyPlayerSettings();
          if (card.pendingPlay){ card.pendingPlay = false; api.play(); }
        });
        api.playerStateChanged.on((e) => {
          playBtn.textContent = e.state === alphaTab.synth.PlayerState.Playing ? '❚❚ Pausar' : '▶ Tocar';
          if (e.stopped) drawBoard([]);
        });
      }
      api.scoreLoaded.on((score) => { try{ card.pos = collectPos(score); card.start = boardStart(card.pos); if (!card.board) card.board = new DynBoard(boardEl); card.board.configure({ start: card.start === null ? 0 : card.start, follow: card.start === null, ghosts: card.pos }); }catch(e){} });
      if (withPlayer) api.playedBeatChanged.on((beat) => { try{ if (card.board) card.board.beat(beat, api.playbackSpeed); }catch(e){} });
      api.tex(block.tex);
    }

    function destroyApi(){
      if (card.api){ try{ card.api.destroy(); }catch(e){} }
      card.api = null; card.ready = false; card.hasPlayer = false;
    }

    card.mountStatic = function(){
      if (typeof alphaTab === 'undefined'){ loadingEl.textContent = 'Não consegui carregar o motor de tablatura. Verifique a conexão.'; return; }
      card.mounted = true;
      createApi(false);
    };
    card.deactivate = function(){
      playBtn.textContent = '▶ Tocar';
      setStatus('');
      loadingEl.style.display = 'flex';
      createApi(false);
    };
    card.destroy = function(){ destroyApi(); };

    function activate(){
      if (activeCard && activeCard !== card) activeCard.deactivate();
      activeCard = card;
      loadingEl.style.display = 'flex';
      createApi(true);
    }

    playBtn.addEventListener('click', () => {
      if (typeof alphaTab === 'undefined') return;
      if (!card.hasPlayer){ card.pendingPlay = true; activate(); return; }
      if (card.ready) card.api.playPause();
    });
    q('.ex-stop').addEventListener('click', () => { if (card.hasPlayer && card.ready) card.api.stop(); });

    function setBpm(v){
      v = Math.min(300, Math.max(20, Math.round(v)));
      card.bpm = v; bpmInput.value = v;
      applyPlayerSettings();
    }
    bpmInput.addEventListener('change', () => setBpm(Number(bpmInput.value) || card.base));
    q('.bpm-minus').addEventListener('click', () => setBpm(card.bpm - 5));
    q('.bpm-plus').addEventListener('click', () => setBpm(card.bpm + 5));

    function wireChip(sel, key){
      const el = q(sel);
      el.addEventListener('click', () => {
        card[key] = el.getAttribute('aria-pressed') !== 'true';
        el.setAttribute('aria-pressed', String(card[key]));
        applyPlayerSettings();
      });
    }
    wireChip('.chip-metro', 'metro');
    wireChip('.chip-count', 'count');
    wireChip('.chip-loop', 'loop');

    exercises.push(card);
    wrap._card = card;
    if (io) io.observe(wrap); else card.mountStatic();
    return wrap;
  }

  function cleanupExercises(){
    if (io){ io.disconnect(); io = null; }
    exercises.forEach(c => c.destroy());
    exercises = []; activeCard = null;
  }

  // ---------- rotas ----------
  async function route(){
    cleanupExercises();
    if ('IntersectionObserver' in window){
      io = new IntersectionObserver((entries) => {
        entries.forEach(en => {
          if (!en.isIntersecting) return;
          const c = en.target._card;
          io.unobserve(en.target);
          if (c && !c.mounted) c.mountStatic();
        });
      }, { rootMargin: '200px' });
    }
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    try{
      if (!courseIndex) courseIndex = await loadJSON('cursos/index.json');
      if (parts[0] === 'c' && parts[1]){
        const course = await getCourse(parts[1]);
        if (parts[2] === 't' && parts[3]) renderTopic(course, parts[3]);
        else renderCourse(course);
      } else {
        renderList();
      }
    }catch(err){
      $back.href = 'index.html'; $back.textContent = '‹ Menu';
      $app.innerHTML = `<div class="pedal"><div class="ex-status error">${esc(err.message)}</div>
        <div class="ex-status">Se você abriu o arquivo direto do computador (file://), use o link do GitHub Pages ou o Live Server.</div></div>`;
    }
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', route);
  route();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      if (localStorage.getItem('appMusica.nosw') !== '1') navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
<script src="nav.js"></script>
</body>
</html>
